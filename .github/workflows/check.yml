name: check

# Validates README.md links, assets, release markers and llms.txt parity.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # macOS runs the same scripts under its own awk, sed and realpath.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the validator's tests
        run: bash .github/check/test.sh
      - name: Check README.md and llms.txt
        run: bash .github/check/check.sh
